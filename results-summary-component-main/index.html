<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>

  <main class="card">
    <section class="result-panel">
      <h2>Your Result</h2>

      <div class="score-circle">
        <span class="score-number">76</span>
        <span class="score-of">of 100</span>
      </div>

      <h1>Great</h1>
      <p class="result-text">
        You scored higher than 65% of the people who have taken these tests.
      </p>
    </section>

    <section class="summary-panel">
      <h2>Summary</h2>

      <ul class="summary-list">
        <li class="item reaction">
          <span class="item-label">
            <img src="./assets/images/icon-reaction.svg" alt="" aria-hidden="true">
            Reaction
          </span>
          <span class="item-score"><strong>80</strong> / 100</span>
        </li>

        <li class="item memory">
          <span class="item-label">
            <img src="./assets/images/icon-memory.svg" alt="" aria-hidden="true">
            Memory
          </span>
          <span class="item-score"><strong>92</strong> / 100</span>
        </li>

        <li class="item verbal">
          <span class="item-label">
            <img src="./assets/images/icon-verbal.svg" alt="" aria-hidden="true">
            Verbal
          </span>
          <span class="item-score"><strong>61</strong> / 100</span>
        </li>

        <li class="item visual">
          <span class="item-label">
            <img src="./assets/images/icon-visual.svg" alt="" aria-hidden="true">
            Visual
          </span>
          <span class="item-score"><strong>73</strong> / 100</span>
        </li>
      </ul>

      <button type="button" class="btn">Continue</button>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by Riadeino.
  </footer>

</body>
</html>
